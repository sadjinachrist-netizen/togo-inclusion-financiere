# Maintient l'application Streamlit Cloud éveillée pendant la période d'évaluation
# du Data Challenge (21 sept. - 18 oct. 2026). À désactiver ensuite :
# onglet Actions du dépôt > Keep dashboard awake > "..." > Disable workflow.
name: Keep dashboard awake

on:
  schedule:
    - cron: "17 */4 * * *"   # toutes les 4 heures
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the dashboard
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            https://togo-inclusion-financiere.streamlit.app/)
          echo "HTTP $code"
          test "$code" = "200"
